# Static Next.js export → out/
#
# Cloudflare dashboard — Builds & deployments (copy EXACTLY):
#   Framework preset: Next.js (Static HTML Export)  — NOT plain "Next.js"
#   Build command:    npm run build
#   Deploy command:   npm run pages:deploy
#   Version command:  exit 0
#   Output directory: out
#
# IMPORTANT:
# - Do NOT set Deploy command to npx wrangler pages deploy (causes auth errors).
# - Delete CLOUDFLARE_API_TOKEN from Settings → Environment variables.
# - Manual CLI upload: npm run pages:upload

name = "opensourceui"
compatibility_date = "2025-08-27"
pages_build_output_dir = "./out"
